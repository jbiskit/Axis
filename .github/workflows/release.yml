name: Release Axis

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing version to build without publishing
        required: true
        default: "0.1.3"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${DISPATCH_VERSION#v}"
            publish=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/axis-tauri/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: crates/axis-tauri/ui
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"

      - name: Verify version consistency
        run: node scripts/verify-release-version.mjs "${{ steps.release.outputs.version }}"

      - name: Type-check UI
        working-directory: crates/axis-tauri/ui
        run: npx tsc --noEmit --pretty false

      - name: Build portable executable
        working-directory: crates/axis-tauri
        run: npx --yes @tauri-apps/cli@2.11.4 build --ci -- --locked

      - name: Test Rust workspace
        run: cargo test --workspace --release --locked

      - name: Generate checksum
        shell: bash
        run: |
          cd target/release
          sha256sum axis.exe > axis.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: axis-${{ steps.release.outputs.version }}-windows
          path: |
            target/release/axis.exe
            target/release/axis.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Axis ${{ steps.release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/axis.exe
            target/release/axis.exe.sha256
